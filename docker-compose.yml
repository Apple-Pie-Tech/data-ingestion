# Standalone compose for the ingestion service.
#
# There is no local backing service left to run: vectors live in S3 Vectors,
# audio in S3, and embeddings come from Bedrock, none of which has a local
# emulator. The container therefore needs AWS credentials to do real work.
# `/health` stays up without them, which is what this file is for.
#
# Credentials are passed through from the host rather than written here. If they
# come from `aws login`, export them first:
#   eval "$(aws configure export-credentials --format env)"
services:
  app:
    build:
      context: .
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:8080,http://localhost:8080}
      STORY_LABELING_ENABLED: ${STORY_LABELING_ENABLED:-false}
      STORY_LABELING_API_BASE_URL: ${STORY_LABELING_API_BASE_URL:-}
      STORY_LABELING_TIMEOUT_SECONDS: ${STORY_LABELING_TIMEOUT_SECONDS:-60}
      STORY_LABELING_SIGN_REQUESTS: ${STORY_LABELING_SIGN_REQUESTS:-false}
      INGEST_API_KEY: ${INGEST_API_KEY:-local-dev-ingest-key}
      INGEST_API_KEY_SECRET_ARN: ${INGEST_API_KEY_SECRET_ARN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWT_SECRET_ARN: ${SUPABASE_JWT_SECRET_ARN:-}
      SUPABASE_JWKS_CACHE_SECONDS: ${SUPABASE_JWKS_CACHE_SECONDS:-600}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-25000000}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      AUDIO_STORAGE_ENABLED: ${AUDIO_STORAGE_ENABLED:-false}
      S3_AUDIO_BUCKET: ${S3_AUDIO_BUCKET:-}
      S3_VECTOR_BUCKET: ${S3_VECTOR_BUCKET:-}
      S3_VECTOR_INDEX: ${S3_VECTOR_INDEX:-apple-pie-story-chunks}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_EMBEDDINGS_MODEL: ${BEDROCK_EMBEDDINGS_MODEL:-cohere.embed-v4:0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-cohere.embed-v4:0}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.8}
      MIN_CHUNK_CHARS: ${MIN_CHUNK_CHARS:-350}
      MAX_CHUNK_CHARS: ${MAX_CHUNK_CHARS:-1400}
      MAX_CHUNK_TOKENS: ${MAX_CHUNK_TOKENS:-350}
      SEMANTIC_TOKENIZER_ENCODING: ${SEMANTIC_TOKENIZER_ENCODING:-cl100k_base}
      CHUNK_OVERLAP_SENTENCES: ${CHUNK_OVERLAP_SENTENCES:-1}
      GRADIUM_API_BASE_URL: ${GRADIUM_API_BASE_URL:-https://example.invalid}
      GRADIUM_API_KEY: ${GRADIUM_API_KEY:-fake-gradium-api-key}
      GRADIUM_API_KEY_SECRET_ARN: ${GRADIUM_API_KEY_SECRET_ARN:-}
      GRADIUM_TRANSCRIPTION_MODEL: ${GRADIUM_TRANSCRIPTION_MODEL:-demo-transcription-model}
      GRADIUM_TRANSCRIPTION_TRANSPORT: ${GRADIUM_TRANSCRIPTION_TRANSPORT:-rest}
      GRADIUM_TRANSCRIPTION_PATH: ${GRADIUM_TRANSCRIPTION_PATH:-/post/speech/asr}
      GRADIUM_LANGUAGE: ${GRADIUM_LANGUAGE:-en}
      GRADIUM_TIMEOUT_SECONDS: ${GRADIUM_TIMEOUT_SECONDS:-60}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8000:8000"
