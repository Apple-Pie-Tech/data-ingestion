[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "apple-pie-data-ingestion"
version = "0.1.0"
description = "Minimal Dockerized ingestion service for Apple Pie"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "azure-storage-blob[aio]>=12.23.0",
  "boto3>=1.35.0",
  # Plain chonkie: the [azure-openai] extra existed only for its AzureOpenAIEmbeddings
  # backend, which Bedrock replaced. tiktoken came in through that extra and is still
  # needed -- Chonkie's SemanticChunker counts chunk_size with it -- so it is explicit now.
  "chonkie>=0.5.0",
  "tiktoken>=0.7.0",
  "qdrant-client>=1.11.0",
  "numpy>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
